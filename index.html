<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedAgenda</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:#eef5ff}.box,.panel,.card{background:white;border:1px solid #e3e7ef;border-radius:14px;padding:20px}.box{width:min(400px,92%)}h1{color:#2563eb}label{display:block;font-weight:bold;font-size:13px;margin:12px 0}input,select{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:8px;margin-top:6px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}.secondary{background:white;color:#344054;border:1px solid #ccd3df}.danger{background:#dc2626}.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #e3e7ef;padding:22px;position:fixed;inset:0 auto 0 0}.logo{font-size:23px;font-weight:800;color:#2563eb;margin-bottom:28px}.nav button{display:block;width:100%;text-align:left;border:0;background:white;padding:11px;border-radius:8px;margin:3px 0;cursor:pointer}.nav button:hover{background:#eef5ff;color:#2563eb}.out{position:absolute;bottom:20px;left:22px;right:22px}.main{margin-left:230px;padding:28px;width:calc(100% - 230px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.muted{color:#667085}.num{font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}table{width:100%;border-collapse:collapse}th,td{padding:11px 7px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.badge{padding:4px 8px;border-radius:99px;font-size:12px;background:#dcfce7;color:#15803d}.doctors{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.doctor{border:1px solid #e3e7ef;border-radius:12px;padding:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px)}.cards{grid-template-columns:repeat(2,1fr)}.grid,.doctors{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
let role=null,page="dashboard",consultas=[["08/10/2026","09:00","Dra. Ana Souza","Cardiologia"],["16/10/2026","14:30","Dr. Carlos Lima","Clínico Geral"]];
const medicos=[["Dra. Ana Souza","Cardiologia",["08/10/2026 09:00","08/10/2026 10:30","09/10/2026 14:00"]],["Dr. Carlos Lima","Clínico Geral",["10/10/2026 08:00","10/10/2026 09:30","16/10/2026 14:30"]],["Dra. Marina Alves","Dermatologia",["12/10/2026 13:00","12/10/2026 15:00"]]];
function login(){root.innerHTML='<div class="login"><div class="box"><h1>✚ MedAgenda</h1><p class="muted">Protótipo — Sistema de Agendamento de Consultas</p><label>Perfil<select id="r"><option value="p">Paciente</option><option value="m">Médico</option><option value="a">Administrador</option></select></label><label>E-mail<input value="demo@medagenda.com"></label><label>Senha<input type="password" value="123456"></label><button class="btn" style="width:100%" onclick="enter()">Entrar</button><p class="muted" style="font-size:12px">Dados demonstrativos; backend Spring Boot/MySQL será conectado posteriormente.</p></div></div>'}
function enter(){role=document.getElementById("r").value;page="dashboard";render()}
function go(x){page=x;render()}
function rn(){return role=="p"?"Paciente":role=="m"?"Médico":"Administrador"}
function render(){let ns=role=="p"?[["dashboard","Dashboard"],["doctors","Buscar médicos"],["appointments","Minhas consultas"],["history","Histórico"],["profile","Meu perfil"]]:role=="m"?[["dashboard","Dashboard"],["agenda","Minha agenda"],["slots","Horários"],["patients","Pacientes"],["profile","Meu perfil"]]:[["dashboard","Dashboard"],["users","Usuários"],["doctors","Médicos"],["specialties","Especialidades"],["all","Consultas"],["reports","Relatórios"],["profile","Meu perfil"]];root.innerHTML='<div class="app"><aside class="side"><div class="logo">✚ MedAgenda</div><b class="muted">'+rn()+'</b><div class="nav">'+ns.map(n=>'<button onclick="go(\''+n[0]+'\')">'+n[1]+'</button>').join("")+'</div><button class="btn secondary out" onclick="login()">Sair</button></aside><main class="main"><div class="top"><h2>'+title()+'</h2><span class="muted">Olá, '+rn()+'</span></div>'+content()+'</main></div>'}
function title(){return ({dashboard:"Visão geral",doctors:"Médicos",appointments:"Minhas consultas",history:"Histórico de consultas",profile:"Meu perfil",agenda:"Minha agenda",slots:"Gerenciar horários",patients:"Pacientes",users:"Usuários",specialties:"Especialidades",all:"Consultas",reports:"Relatórios"})[page]}
function cards(a){return '<div class="cards">'+a.map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join("")+'</div>'}
function content(){if(page=="dashboard")return dash();if(page=="doctors")return docs();if(page=="appointments")return appts();if(page=="history")return hist();if(page=="profile")return profile();if(page=="agenda")return agenda();if(page=="slots")return slots();if(page=="patients")return patients();if(page=="users")return users();if(page=="specialties")return specs();if(page=="all")return all();return reports()}
function dash(){if(role=="p")return cards([["Próximas consultas",consultas.length],["Médicos disponíveis",12],["Especialidades",8],["Canceladas",1]])+'<div class="grid"><div class="panel"><h3>Próximas consultas</h3>'+tabP()+'</div><div class="panel"><h3>Ações rápidas</h3><button class="btn" onclick="go(\'doctors\')">Agendar consulta</button></div></div>';if(role=="m")return cards([["Consultas hoje",4],["Próximas consultas",12],["Horários livres",7],["Pacientes",86]])+'<div class="grid"><div class="panel"><h3>Agenda de hoje</h3>'+tabM()+'</div><div class="panel"><h3>Ações rápidas</h3><button class="btn" onclick="go(\'slots\')">Gerenciar horários</button></div></div>';return cards([["Pacientes",428],["Médicos ativos",32],["Consultas no mês",764],["Especialidades",18]])+'<div class="grid"><div class="panel"><h3>Resumo de consultas</h3>'+tabA()+'</div><div class="panel"><h3>Administração</h3><button class="btn" onclick="go(\'users\')">Gerenciar usuários</button></div></div>'}
function tabP(){return "<table><tr><th>Data</th><th>Médico</th><th>Status</th></tr>"+consultas.map(c=>"<tr><td>"+c[0]+" "+c[1]+"</td><td>"+c[2]+"</td><td><span class=badge>Confirmada</span></td></tr>").join("")+"</table>"}
function tabM(){return "<table><tr><th>Horário</th><th>Paciente</th></tr><tr><td>08:00</td><td>João Silva</td></tr><tr><td>09:30</td><td>Maria Oliveira</td></tr><tr><td>11:00</td><td>Pedro Santos</td></tr></table>"}
function tabA(){return "<table><tr><th>Data</th><th>Paciente</th><th>Médico</th></tr><tr><td>08/10</td><td>João Silva</td><td>Ana Souza</td></tr><tr><td>08/10</td><td>Maria Oliveira</td><td>Carlos Lima</td></tr></table>"}
function docs(){return '<div class="panel"><input id="q" placeholder="Buscar médico ou especialidade" oninput="filter()"><div class="doctors" id="dl" style="margin-top:14px">'+docCards(medicos)+'</div></div>'}
function docCards(ds){return ds.map((d,i)=>'<div class="doctor"><h3>'+d[0]+'</h3><p class=muted>'+d[1]+'</p><p>Próximos horários:</p>'+d[2].map(s=>'<button class="btn secondary" style="margin:3px" onclick="book('+i+',\''+s+'\')">'+s+'</button>').join("")+'</div>').join("")}
function filter(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("dl").innerHTML=docCards(medicos.filter(d=>(d[0]+d[1]).toLowerCase().includes(q)))}
function book(i,s){if(confirm("Confirmar consulta com "+medicos[i][0]+" em "+s+"?")){let x=s.split(" ");consultas.push([x[0],x[1],medicos[i][0],medicos[i][1]]);alert("Consulta agendada com sucesso!");go("appointments")}}
function appts(){return '<div class="panel"><h3>Consultas futuras</h3><table><tr><th>Data</th><th>Horário</th><th>Médico</th><th>Ação</th></tr>'+consultas.map((c,i)=>'<tr><td>'+c[0]+'</td><td>'+c[1]+'</td><td>'+c[2]+'</td><td><button class="btn danger" onclick="cancelar('+i+')">Cancelar</button></td></tr>').join("")+'</table></div>'}
function cancelar(i){if(confirm("Cancelar consulta?")){consultas.splice(i,1);render()}}
function hist(){return '<div class="panel"><h3>Histórico</h3><table><tr><th>Data</th><th>Médico</th><th>Status</th></tr><tr><td>18/09/2026</td><td>Dra. Ana Souza</td><td><span class=badge>Realizada</span></td></tr><tr><td>03/08/2026</td><td>Dr. Carlos Lima</td><td><span class=badge>Realizada</span></td></tr></table></div>'}
function profile(){return '<div class="panel" style="max-width:700px"><h3>Dados pessoais</h3><label>Nome<input value="'+rn()+'"></label><label>E-mail<input value="demo@medagenda.com"></label><label>Telefone<input value="(16) 99999-9999"></label><button class="btn" onclick="alert(\'Perfil atualizado!\')">Salvar alterações</button></div>'}
function agenda(){return '<div class="panel"><h3>Minha agenda</h3>'+tabM()+'</div>'}
function slots(){return '<div class="panel"><button class="btn" onclick="alert(\'Cadastro de horário aberto.\')">+ Cadastrar horário</button>'+tabSlots()+'</div>'}
function tabSlots(){return '<table style="margin-top:15px"><tr><th>Data</th><th>Horário</th><th>Status</th><th>Ação</th></tr><tr><td>08/10/2026</td><td>15:00</td><td><span class=badge>Disponível</span></td><td><button class="btn secondary" onclick="alert(\'Horário bloqueado.\')">Bloquear</button></td></tr></table>'}
function patients(){return '<div class="panel"><h3>Pacientes</h3>'+tabM()+'</div>'}
function users(){return '<div class="panel"><button class="btn" onclick="alert(\'Cadastro de usuário aberto.\')">+ Novo usuário</button><table style="margin-top:15px"><tr><th>Nome</th><th>Perfil</th><th>Status</th></tr><tr><td>João Silva</td><td>Paciente</td><td><span class=badge>Ativo</span></td></tr><tr><td>Dr. Carlos Lima</td><td>Médico</td><td><span class=badge>Ativo</span></td></tr></table></div>'}
function specs(){return '<div class="panel"><button class="btn" onclick="alert(\'Nova especialidade aberta.\')">+ Nova especialidade</button><table style="margin-top:15px"><tr><th>Especialidade</th><th>Médicos</th></tr><tr><td>Cardiologia</td><td>6</td></tr><tr><td>Clínico Geral</td><td>10</td></tr><tr><td>Dermatologia</td><td>4</td></tr></table></div>'}
function all(){return '<div class="panel"><h3>Todas as consultas</h3>'+tabA()+'</div>'}
function reports(){return cards([["Consultas no mês",764],["Realizadas",612],["Canceladas",73],["Taxa de realização","80%"]])+'<div class="panel"><h3>Relatório mensal</h3><p class=muted>Protótipo de relatório administrativo.</p><button class="btn" onclick="alert(\'Relatório gerado!\')">Gerar relatório</button></div>'}
login();
</script></body></html>
